spring.application.name=autoflow-backend
server.port=8080

# Active profile:
# - 'dev': Built-in H2 database (Zero setup needed, runs immediately out of the box!)
# - 'mysql': Local/Remote MySQL 8.0 database (autoflow_db)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# n8n Integration Defaults
n8n.base-url=${N8N_BASE_URL:http://localhost:5678}
n8n.api-key=${N8N_API_KEY:}
n8n.webhook-base-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook}

# Logging
logging.level.com.autoflow=INFO
logging.level.org.springframework.web=INFO
