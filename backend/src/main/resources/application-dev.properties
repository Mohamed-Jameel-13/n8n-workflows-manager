# ==========================================================
# Development Profile (H2 In-Memory Database)
# Note: Common properties (server.port, n8n config, etc.) are 
# automatically inherited from application.properties.
# ==========================================================

# Datasource Configuration (Zero-setup in-memory H2 database)
spring.datasource.url=jdbc:h2:mem:autoflow_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
# Password is intentionally empty for default H2 'sa' account
spring.datasource.password=

# JPA / Hibernate Configuration for Dev
# Re-creates tables in memory on each boot and seeds fresh mock data
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# H2 Web Console (Available at http://localhost:8080/h2-console)
# Connect with:
#   Driver Class: org.h2.Driver
#   JDBC URL: jdbc:h2:mem:autoflow_db
#   User Name: sa
#   Password: (leave blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
